name: respell
description: A text widget that morphs between strings in one wave across its letters. Shared letters blur and swap, extra letters write on with a glow, removed letters backspace.
version: 0.1.0
repository: https://github.com/PriyanshuMallick/respell
issue_tracker: https://github.com/PriyanshuMallick/respell/issues
topics: [animation, text, transition, widget]

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
